[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erebos"
version = "0.1.0-dev"
description = "Network-agnostic LLM harness with multi-provider routing and GTK4 interface"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Jerry Jackson", email = "ohmytallest@gmail.com"}
]
keywords = ["llm", "ollama", "claude", "gemini", "gtk4", "ai", "linux"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime dependencies only.
# Add [cloud] extras for API providers as their clients land.
dependencies = [
    "requests>=2.31.0",
    "zeroconf>=0.148.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]

# Cloud API provider SDKs — install when provider clients are implemented.
cloud = [
    "anthropic>=0.34.0",
]

# GTK4 UI — Linux only, requires system libadwaita/pygobject.
gtk = [
    "PyGObject>=3.46.0",
]

# Development toolchain.
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "pylint>=3.0.0",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
]

[project.urls]
Homepage      = "https://github.com/continuity-bridge/erebos"
Repository    = "https://github.com/continuity-bridge/erebos"
Issues        = "https://github.com/continuity-bridge/erebos/issues"
Documentation = "https://github.com/continuity-bridge/erebos/wiki"

[project.scripts]
erebos = "erebos.main:main"


# ---------------------------------------------------------------------------
# Package discovery
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
where   = ["."]
include = ["erebos*"]
exclude = ["tests*", "docs*"]


# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------

[tool.black]
line-length    = 100
target-version = ["py311"]
include        = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | build
  | dist
)/
'''


# ---------------------------------------------------------------------------
# Pylint
# ---------------------------------------------------------------------------

[tool.pylint.main]
max-line-length = 100
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
]

[tool.pylint.format]
max-line-length = 100


# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version      = "3.11"
warn_return_any     = true
warn_unused_configs = true
ignore_missing_imports = true
# disallow_untyped_defs = true  # Enable when codebase matures


# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files  = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=erebos",
    "--cov-report=term-missing",
    "--cov-report=html",
]


# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["erebos"]
omit   = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]